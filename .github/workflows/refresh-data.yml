name: Refresh market data

on:
  schedule:
    # 美股收盘后：21:30 UTC ≈ 美东 17:30（夏令时）/ 16:30（冬令时），周一至周五
    - cron: "30 21 * * 1-5"
    # 开盘前补一刀：13:00 UTC ≈ 美东 9:00，接住 Yahoo 迟到的日线
    - cron: "0 13 * * 1-5"
    # 盘中每 30 分钟刷新（14:00–20:30 UTC ≈ 美东 10:00–16:30），页面更接近实时
    - cron: "0,30 14-20 * * 1-5"
  workflow_dispatch: {}   # 手动触发按钮（Actions 页面随时点）

permissions:
  contents: write
  issues: write   # 信号告警建 Issue → GitHub 自动邮件通知

# 同一时间只跑一个实例：防止小时任务互相踩、与本地推送竞争
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 2026-09-20 30 → 45：C2+C3 的边界带加算让全量 run_all 从 11.3 → 约 13.6 分钟，
    # 而「Run pipeline」步自带一次重试（首次失败 → sleep 60 → 再跑一遍全量）。
    # 重试路径 = 13.6 + 1 + 13.6 ≈ 28.2 分钟，加上 checkout/pip/playwright/pytest/
    # valpha150/站点审计的约 8 分钟固定开销 → 约 36 分钟，**30 分钟必被杀**。
    # 注：这条在加算之前就已经踩线（11.3×2+1+8 ≈ 31.6），只是没赶上「首次抓取抖动」而已。
    # 代价：真卡死的 job 要多烧 15 分钟才被杀。取 45 不取更大，是要它仍然是个「门」。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (core pipeline only)
        run: pip install -r market-analysis/requirements-core.txt

      - name: Install browser audit dependencies
        # 仅全量刷新(盘前/盘后/手动)需要浏览器审计；盘中 30 分钟 light 跳过，省 Chromium 安装
        if: github.event.schedule != '0,30 14-20 * * 1-5'
        run: |
          python -m pip install "playwright>=1.40,<2"
          python -m playwright install --with-deps chromium

      - name: Run tests (gate — bad code must not publish data)
        run: python -m pytest market-analysis/tests -q

      # light 运行复用上次全量运行的 data/（学习LR/回测/长历史），
      # 否则 build_signals 退化到手设 LR，小时级信号会漂移
      - name: Restore data cache from last run
        # 2026-09-03 根治(§2 #1):**只缓存可再生的派生数据**,不再缓存整个 market-analysis/data。
        # 原来 path 是整个目录 → 31 个 git 跟踪的 append-only 账本也被缓存 → restore-keys 命中
        # 旧缓存时把陈旧账本整个回灌,再被 `git add -A` 提交成缩水版(07-24 连红四天、
        # 08-29 抹掉用户自选组合配置,都是这个根因)。账本的真相在 git,缓存它只有坏处没有好处。
        # 收窄后 raw/ 全部、processed/ 绝大部分仍被缓存(light 模式复用长历史/回测结果所必需),
        # processed/ 里仅剩的 4 个跟踪文件由下一步无条件从 git 复位。
        uses: actions/cache@v4
        with:
          path: |
            market-analysis/data/raw
            market-analysis/data/processed
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-

      - name: Re-assert tracked data files from git (cache can't override them)
        # 2026-09-03 改为**无清单**写法(§2 #1 收尾)。
        #
        # 原来这里手工列了 23 个账本文件名,逐个 `git checkout --`。问题不在它不管用,
        # 而在**清单会漂移**:加了新账本忘了加进清单 → 那本账继续裸奔(08-29 用户的
        # my_portfolio.txt 就是这么被抹掉的,当时清单里没有它)。为此还得再养一个
        # 守门测试去盯清单——用测试去补一份本不该由人维护的清单。
        #
        # 现在直接对整个目录复位:`git checkout -- <dir>` 只作用于**被跟踪**的文件,
        # 未跟踪的派生缓存(raw/、processed/ 里的中间产物)一律不碰。所以它天然覆盖
        # 全部现有账本 + 将来新加的任何账本,清单不存在,也就无从漂移。
        #
        # 顺序:必须在 cache 回灌之后、流水线之前。流水线随后照常往账本 append。
        run: |
          git checkout -- market-analysis/data/ .benchmark-history.json
          echo "已从 git HEAD 复位 $(git ls-files market-analysis/data/ | wc -l) 个被跟踪的数据文件"

      - name: Run pipeline (intraday 30-min = light, pre-open/post-close = full)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # 取 FRED 全史(BAA10Y 信用利差等日频);未配置则脚本自动回退 graph CSV(~2年)
          SEC_UA_CONTACT: ${{ secrets.SEC_UA_CONTACT }}   # SEC Form4 取数(fetch_insider)必带真实联系UA;未配置则 SEC 403→该步静默跳过(不阻断)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}     # LLM 大白话日读(llm_daily_read);未配置则该步静默跳过
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}         # 可选:设 openai 走 DeepSeek 等 OpenAI 兼容(需配 LLM_API_KEY)
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # 日读/计分卡 推送(未配置静默跳过)
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 仅盘后(21:30 UTC)或手动触发时推日读 Telegram；盘前/盘中不推（数据不是最新盘后）
          TG_DAILY_PUSH: ${{ github.event.schedule == '30 21 * * 1-5' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "${{ github.event.schedule }}" = "0,30 14-20 * * 1-5" ]; then
            CMD="python market-analysis/scripts/run_all.py --light"
          else
            CMD="python market-analysis/scripts/run_all.py"
          fi
          # 瞬时网络/yfinance 抖动会让整条刷新失败、白丢本次调度 → 自动重试一次。
          # run_all 每步都重写产物(幂等)、末步 verify_output 仍把关 → 重试不会发布坏数据;
          # 真错(代码/数据问题)会两次都失败 → 仍正确地红，不被掩盖。
          $CMD || { echo "::warning::pipeline 首次失败，60s 后重试一次（疑似瞬时抓取抖动）"; sleep 60; $CMD; }

      - name: Refresh Valpha150 大盘数据 (每交易日一次，仅盘后全量/手动)
        # ~152 只批量抓价较重 → 不进盘中 light，只在盘后全量(21:30)或手动跑；失败不阻断主刷新
        if: github.event.schedule == '30 21 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}   # 财报日历(fetch_earnings);未配置则该步静默跳过
        run: |
          python market-analysis/scripts/build_valpha150.py || echo "::warning::valpha150 刷新失败(非致命，下次重试)"
          python market-analysis/scripts/build_wildpool.py || echo "::warning::wildpool 刷新失败(非致命，下次重试)"
          python market-analysis/scripts/ticker_ondemand.py || echo "::warning::点单深算失败(非致命，下次重试)"
          python market-analysis/scripts/build_ndx.py || echo "::warning::纳指100成分追踪失败(非致命，下次重试)"
          python market-analysis/scripts/fetch_earnings.py || echo "::warning::财报日历失败(非致命，下次重试)"

      - name: Refresh CFTC COT + CBOE Put/Call (#7 数据层，每交易日一次，仅盘后全量/手动)
        # 首次跑=全量回填(COT 逐年 zip；P/C 断点续传逐日 JSON)；之后每天都是增量(各 1~2 个请求)。
        # 两者都是可再生缓存(非账本)，失败不阻断主刷新。
        if: github.event.schedule == '30 21 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: |
          python market-analysis/scripts/fetch_cot.py || echo "::warning::CFTC COT 刷新失败(非致命，下次重试)"
          python market-analysis/scripts/fetch_putcall.py || echo "::warning::CBOE Put/Call 刷新失败(非致命，下次重试)"

      - name: Strict-JSON check for Valpha150 family products (P1-6：拦截 NaN/Infinity 白屏)
        # 上一步 5 个产物在 run_all 的 verify_output 质量门之后单独生成，不过那道门。
        # Python json.load 默认放行 NaN/Infinity（悄悄转成 float('nan') 通过），
        # 但浏览器 JSON.parse 会拒绝整份文件 → 前端白屏；本步非零退出会阻断下面的
        # 提交/推送步骤，防止把含 NaN 的坏产物推上线（把关哲学与 verify_output 一致）。
        if: github.event.schedule == '30 21 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: >
          python market-analysis/scripts/check_strict_json.py
          valpha150.json wildpool.json ticker_ondemand.json ndx.json earnings.json

      - name: Signal alerts (state changes only)
        env:                                  # 可选 Telegram 推送；未配置 Secrets 则脚本静默跳过
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOLDINGS: ${{ secrets.HOLDINGS }}   # 个人持仓(逗号/换行分隔)→持仓感知告警;未配置则只发市场级告警
        run: python market-analysis/scripts/alert_check.py

      - name: Browser site audit (desktop + mobile)
        # 同上门控：盘中 light 不跑（只改 quotes.json，布局不会回归；站点改动已由 site-audit.yml 覆盖）
        if: github.event.schedule != '0,30 14-20 * * 1-5'
        run: |
          python tools/site_audit.py --ci
          python tools/site_audit.py --mobile --ci

      - name: Open alert issue (GitHub emails you automatically)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f market-analysis/alert.md ]; then
            # label 不存在时 issue create 会整体失败且被 ||true 吞掉 → 先幂等建 label；
            # --assignee 保证触发"参与通知"邮件（仅靠 bot 建 issue 不一定发邮件）
            gh label create alert --color D93F0B --description "信号告警" || true
            gh issue create \
              --title "📣 信号告警 $(date -u +%Y-%m-%d)" \
              --body-file market-analysis/alert.md \
              --assignee Vambrocop \
              --label alert || true
            rm market-analysis/alert.md
          fi

      - name: Commit & push if data changed
        # 2026-09-03(§2 #2/#3/#4):发布逻辑搬进 tools/ci_publish.py。
        #   · 为什么搬:原来这段 commit/push 写在 YAML 里、**本地跑不了**,07-24~27 主流水线
        #     连红四天就是改一次推一次等一轮 CI。现在 test_ci_publish.py 用真 git 裸仓
        #     跑通"无改动/正常推/推冲突→rebase 重试/门告警"四条路径,先在本地红。
        #   · `git add -A` → 显式暂存 web/docs/data + 根部 .benchmark-history.json:
        #     误入工作树的东西(陈旧回灌、scratch、误改源码)再也进不了自动提交。
        #     覆盖率由测试对着真实 CI 提交历史核,漏声明会当场变红。
        #   · --guard 把防缩水门重新挂上,但**只警告不阻断**——07-28 它以阻断 push 的方式
        #     失败,把全站停更四天,代价远大于它防的稀有丢行。
        run: |
          python tools/ci_publish.py             --message "chore: auto-refresh market data [skip ci]"             --guard tools/ci_ledger_guard.py             --empty-note "数据无变化,跳过提交"
